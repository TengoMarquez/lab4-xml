<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>XML Book Catalog Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .book { border: 1px solid #ddd; padding: 10px; margin: 8px 0; border-radius: 6px; }
    .title { font-weight: bold; font-size: 1.1em; }
    .meta { color: #444; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>Book Catalog</h1>
  <div id="books">Loading...</div>

  <script>
    // Load XML and display book data (per lab4 template.doc requirements)
    fetch('./book.xml')
      .then(resp => resp.text())
      .then(text => {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(text, "application/xml");
        const bookNodes = xmlDoc.getElementsByTagName('book');
        const container = document.getElementById('books');
        container.innerHTML = '';

        // Iterate through book nodes to display each book's info
        for (let i = 0; i < bookNodes.length; i++) {
          const book = bookNodes[i];
          const id = book.getAttribute('id');
          const title = book.getElementsByTagName('title')[0].textContent;
          const author = book.getElementsByTagName('author')[0].textContent;
          const price = book.getElementsByTagName('price')[0].textContent;

          const el = document.createElement('div');
          el.className = 'book';
          el.innerHTML = `<div class="title">${title} <small style="font-weight:normal">[${id}]</small></div>
                          <div class="meta">Author: ${author}</div>
                          <div class="meta">Price: ¥${price}</div>`;
          container.appendChild(el);
        }
      });
  </script>
</body>
</html>
